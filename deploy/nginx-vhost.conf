# gateway.mcpharbor.dev -> MCP Gateway (Phoenix release on 127.0.0.1:__PORT__)
# Installed once by deploy/deploy.sh. certbot then adds the HTTPS server block,
# so later deploys leave this file alone.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Tool arguments are small; large bodies are not a thing this API needs.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upstream MCP server can take a while on a cold start (npx fetches the package),
        # and the gateway's own call deadline is the real bound, so allow it room.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Streamable HTTP may answer a request with an SSE stream; never buffer that.
        proxy_buffering off;
    }
}
